     flex column. The drop line must follow the cards, not this container. */

    width: 100%; border-radius: var(--harness-entry-radius);
    border: .5px solid #3a3a3f; background: #26272b; padding: 10px 14px; color: #ddd;

  .composer { align-items: center; }
  [data-slot="conversation.composer.dock"] { display: contents; }

     display:contents, so the sortable order must land on the outlet's children
     and the tuck target is the shipped "more actions" button inside it. */

  [data-slot="conversation.session.header.utilities"] { display: contents; }
  /* The shipped strip paints glyph-only buttons with no surface of their own;
     mirror that or the ghost fill check below tests the fixture, not the row. */

  .header-host-menu { position: fixed; width: 200px; background: #26272b; border: 1px solid #3a3a3f; border-radius: 8px; padding: 4px; }
  .header-host-menu[hidden] { display: none; }
  .header-host-menu .host-row { display: block; width: 100%; text-align: left; padding: 6px 8px; }
  /* Mirrors the shipped menu: a flex column viewport, so persisted host-row
     order is expressed with style.order on each viewport child. */
  #header-host-viewport { display: flex; flex-direction: column; }
  [data-slot="sidebar.footer.action"] { display: flex; gap: 6px; }
  .settings nav { display: block; }
  .settings-list { display: flex; flex-direction: column; width: 200px; }
  .settings-list .navCell { width: 100%; border: 0; background: transparent; color: inherit; text-align: left; padding: 4px; }
  .settings-list .navIcon { display: inline-flex; }
  .settings-list .navLabel { white-space: nowrap; }
  #result { white-space: pre-wrap; padding: 12px 18px; font-family: ui-monospace, monospace; }
  .ok { color: #6ee7a8; }
  .bad { color: #ff7b72; }

<script>
  const log = [];
  const failures = [];
  function note(text, ok) {
    log.push((ok ? "PASS " : "FAIL ") + text);
    if (!ok) failures.push(text);
  }
  function assert(name, condition, extra) {
    note(name + (condition ? "" : " — " + (extra === undefined ? "" : String(extra))), !!condition);
  }
  function wait(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
  function orderOf(scope) {
    return Array.from(document.querySelectorAll('[data-dso-scope="' + scope + '"]'))
      .filter((node) => !node.dataset.dsoHidden)
      .sort((a, b) => Number(a.style.order) - Number(b.style.order))
      .map((node) => node.dataset.dsoKey);
  }

  // The header strip sorts wrapper units (the shipped slot wraps some buttons
  // in a span), so read order from the unit, not from the marked target.
  function unitsOf(scope, container) {
    const units = [];
    for (const node of container.querySelectorAll('[data-dso-scope="' + scope + '"]')) {
      let unit = node;
      while (unit.parentElement && unit.parentElement !== container) unit = unit.parentElement;
      if (units.indexOf(unit) === -1) units.push(unit);
    }
    return units;
  }
  function unitOrderOf(scope, container) {
    const selector = '[data-dso-scope="' + scope + '"]';
    return unitsOf(scope, container)
      .filter((unit) => !unit.querySelector('[data-dso-hidden="1"]') && unit.getAttribute("data-dso-hidden") !== "1")
      .sort((a, b) => Number(a.style.order) - Number(b.style.order))
      .map((unit) => (unit.matches(selector) ? unit : unit.querySelector(selector)).dataset.dsoKey);
  }

  // register real components; the runtime tests below never render them.
  const ReactStub = {
    createElement() { return {}; },
    useState() { return [0, function () {}]; },
    useEffect() {},
    useRef() { return { current: null }; },
    Fragment: "fragment",
    Component: class { constructor(props) { this.props = props; this.state = {}; } },
  };
  const slots = new Map();
  function addEntry(slot, options) {
    if (!slots.has(slot)) slots.set(slot, []);
    slots.get(slot).push({ options });
  }
  addEntry("sidebar.panellist", { id: "plugins", label: "插件" });
  addEntry("sidebar.panellist", { id: "schedules", label: "计划" });
  addEntry("sidebar.panellist", { id: "files", label: "文件" });
  addEntry("sidebar.panellist", { id: "browser", label: "浏览器" });
  addEntry("sidebar.panellist", { id: "terminal", label: "终端" });
  addEntry("sidebar.panellist", { id: "tasks", label: "任务" });
  addEntry("sidebar.footer.action", { id: "footer-settings", label: "设置" });
  addEntry("sidebar.footer.action", { id: "footer-help", label: "帮助" });
  addEntry("sidebar.footer.action", { id: "footer-feedback", label: "反馈" });
  addEntry("conversation.view", { id: "chat", label: "对话" });
  addEntry("conversation.view", { id: "trajectory", label: "轨迹" });
  addEntry("conversation.view", { id: "diff", label: "变更" });
  addEntry("conversation.composer.dock", { id: "stats", label: "统计" });
  addEntry("conversation.composer.dock", { id: "context", label: "上下文" });
  addEntry("conversation.composer.dock", { id: "activity", label: "活动" });
  addEntry("settings.section", { id: "account", label: "账户" });
  addEntry("settings.section", { id: "general", label: "通用" });
  addEntry("settings.section", { id: "models", label: "模型" });
  addEntry("settings.section", { id: "plugins", label: "插件" });
  addEntry("settings.section", { id: "better", label: "Better Sidebar" });
  addEntry("settings.section", { id: "about", label: "关于" });

  const ctx = {
    logger: { debug() {}, info() {}, warn() {} },
    effect(fn) { this.__cleanup = fn(); return () => this.__cleanup && this.__cleanup(); },
    slots: {
      entriesOfSlot(slot) { return (slots.get(slot) || []).slice(); },
      inject(slot, callback) { callback(); },
      register() { throw new Error("register used outside inject"); },
    },
  };
  // register needs the slot name; wrap it with the inject closure.
  ctx.slots.inject = function (slot, callback) {
    const previous = ctx.slots.register;
    ctx.slots.register = function (options, component) {
      addEntry(slot, options);
      if (slot === "settings.section") {
        // make the host render our settings row, like the real settings nav
        const list = document.getElementById("settings-list");
        if (list && !document.querySelector('[data-testid="layout-organizer"]')) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "navCell";
          button.dataset.testid = "layout-organizer";
          button.innerHTML =
            '<span class="navIcon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 5h10M3 11h10" stroke="currentColor"/></svg></span>' +
            '<span class="navLabel">布局整理</span>';
          list.appendChild(button);
        }
      }
      return { dispose() {} };
    };
    callback();
    ctx.slots.register = previous;
  };

  // v3 layout. The sidebar part is the shape a v2 flat layout migrates to;
  // the right part deliberately reproduces the 0.5.4 bug where a newly
  // discovered entry ("new-terminal") was persisted at the end instead of at
  // its host position. The one-shot repair must move it back.
  localStorage.clear();
  localStorage.setItem("dsh.sidebar-organizer.layout.v1", JSON.stringify({
    version: 3,
    scopes: {
      sidebar: {
        order: ["terminal", "browser", "files", "plugins", "schedules", "tasks"],
        hidden: ["tasks"],
      },
      right: {
        order: ["files", "browser", "terminal", "new-terminal"],
        hidden: [],
      },
      // 0.6.x saved the explorer split control as a header row; 0.7.0 skips it
      // (it belongs to the host). The stale entry has to survive at the front of
      // the order, exactly like the layout a user upgrading from 0.6.5 carries.
      header: {
        order: ["header-explorer"],
        hidden: [],
      },
    },
  }));

  window.__harnessCtx = ctx;

  window.__ModuleLoader__ = {
    load({ factory }) {
      window.__plugin = factory(function require(name) {
        if (name === "react") return ReactStub;
        if (name === "@deepseek-ai/dsh-client-ui-primitives") return {};
        return null;
      });
    },
  };

  const result = document.getElementById("result");
  function finish() {

      const headerLayout = api.exportConfig();

      panelRows[0].dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
      await wait(160);
      assert("clicking a tucked row runs the host action", invoked === 1, "invoked=" + invoked);
      assert("choosing a tucked row closes the popup", !document.querySelector("[data-dso-ctx-panel]"), "panel still open");

      const panel2 = await openMorePanel();
      assert("the popup reopens after a choice", !!panel2, "no panel");
      const revealRow = panel2.querySelector("[data-dso-ctx-more-key]");
      const revealRect = revealRow.getBoundingClientRect();
      revealRow.dispatchEvent(
        new PointerEvent("pointerdown", {
          bubbles: true,
          cancelable: true,
          button: 0,
          pointerId: 83,
          clientX: revealRect.left + 10,
          clientY: revealRect.top + revealRect.height / 2,
        })
      );
      await wait(330);
      assert("dragging out of the popup lifts a ghost", !!document.querySelector(".dso-ghost"), "no ghost");
      const dropRow = ctxVisual(sessionMenu)[1];
      const dropRect = dropRow.getBoundingClientRect();
      document.dispatchEvent(
        new PointerEvent("pointermove", { bubbles: true, cancelable: true, pointerId: 83, clientX: dropRect.left + 12, clientY: dropRect.top + 2 })
      );
      document.dispatchEvent(
        new PointerEvent("pointerup", { bubbles: true, cancelable: true, pointerId: 83, clientX: dropRect.left + 12, clientY: dropRect.top + 2 })
      );
      await wait(340);
      assert("dropping a tucked row back reveals it", ctxLabels(sessionMenu).indexOf("复制 Session ID") >= 0, ctxLabels(sessionMenu).join(","));
      assert(
        "a revealed row leaves the hidden list",
        (ctxStore().menus.session.hidden || []).length === 0,
        JSON.stringify(ctxStore().menus.session)
      );
      assert("the empty More anchor disappears again", !moreAnchor(), "anchor still present");

      sessionMenu.hidden = true;
      workspaceMenu.hidden = false;
      workspaceRow.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, button: 2, clientX: 40, clientY: 60 }));
      await wait(120);
      assert(
        "workspace menu rows are tagged",
        workspaceMenu.querySelectorAll("[data-dso-ctx-id]").length === 5,
        String(workspaceMenu.querySelectorAll("[data-dso-ctx-id]").length)
      );
      const submenuUnit = ctxUnit(workspaceMenu, "打开方式");
      assert("a display:contents contribution is still reorderable", !!submenuUnit, "submenu row not tagged");      assert(
        "the tagged slot is the real flex item, not the wrapper",
        !!submenuUnit && submenuUnit.classList.contains("_submenuHost_ctx"),
        submenuUnit && submenuUnit.className
      );
      assert(
        "a hidden submenu panel neither adds rows nor steals the label",
        ctxLabels(workspaceMenu).length === 5 && ctxLabels(workspaceMenu).indexOf("打开方式") !== -1,
        ctxLabels(workspaceMenu).join(",")
      );
      await ctxToggle(workspaceMenu, "重命名工作区");
      assert(
        "the workspace menu keeps its own layout",
        ctxStore().menus.workspace.dividers.join(",") === "2,3",
        JSON.stringify(ctxStore().menus.workspace)
      );
      // A divider below the last row is dropped on the next paint (the rule the
      // user asked for), and the pruned list is written back.
      api.contextMenu.set("workspace", { order: [], dividers: [3, 5], customized: true });
      await wait(80);
      assert(
        "a divider past the last row is pruned",
        ctxStore().menus.workspace.dividers.join(",") === "3",
        JSON.stringify(ctxStore().menus.workspace)
      );

      api.contextMenu.setEnabled(false);
      await wait(80);
      assert(
        "turning the feature off restores the host menu",
        workspaceMenu.querySelectorAll("[data-dso-ctx-id]").length === 0 &&
          workspaceMenu.querySelectorAll("[data-dso-ctx-divider]").length === 0,
        "still painted"
      );
      api.contextMenu.setEnabled(true);
      workspaceRow.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, button: 2, clientX: 40, clientY: 60 }));
      await wait(120);
      assert(
        "turning the feature back on repaints the custom layout",
        ctxDividers(workspaceMenu).join(",") === "3",
        ctxDividers(workspaceMenu).join(",")
      );

      // A row that has not been laid out yet (a plugin registers its entries a
      // beat after the menu opens) measures at 0px. The first toggle must save
      // the host's document order, not that transient measurement.
      workspaceMenu.hidden = true;
      api.contextMenu.reset();
      sessionMenu.hidden = false;
      sessionRow.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, button: 2, clientX: 40, clientY: 40 }));
      await wait(120);
      const misplaced = ctxUnit(sessionMenu, "分叉会话");
      misplaced.style.position = "absolute";
      misplaced.style.top = "0px";
      misplaced.style.left = "600px";
      const domIds = Array.from(sessionMenu.querySelectorAll("[data-dso-ctx-id]")).map((unit) => unit.dataset.dsoCtxId);
      await ctxToggle(sessionMenu, "复制 Session ID");
      assert(
        "a row measured at zero keeps its document slot in the saved order",
        ctxStore().menus.session.order.join(",") === domIds.join(","),
        JSON.stringify(ctxStore().menus.session)
      );
      misplaced.style.position = "";
      misplaced.style.top = "";
      misplaced.style.left = "";

      workspaceMenu.hidden = true;
      sessionMenu.hidden = true;
      // The host unmounts the portal; here hiding is not a childList mutation, so
      // ask for one more sync the way an unrelated DOM change would.
      sessionRow.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, button: 2, clientX: 4, clientY: 4 }));
      await wait(80);
      assert("closing the menu releases the row tags", document.querySelectorAll("[data-dso-ctx-id]").length === 0);
      api.contextMenu.reset();
      await wait(60);
      const clearedStore = ctxStore();
      assert(
        "reset clears the right-click menu customizations",
        !clearedStore || !clearedStore.menus || !clearedStore.menus.session,
        JSON.stringify(clearedStore)
      );

      // Leave drag switches and layout in their default state for dispose.
      api.setDragEnabled("right", true);
      api.reset();

      api.dispose();
      assert("dispose clears row marks", document.querySelectorAll("[data-dso-key]").length === 0);
      assert("dispose restores order", document.querySelector('[data-testid="feedback"]').style.order === "", 'order=' + document.querySelector('[data-testid="feedback"]').style.order);
    } catch (error) {
      note("uncaught: " + (error && error.stack ? error.stack : error), false);
    } finally {
      finish();
    }
  })();
</script>
<style>
  /* The real host sheet is installed after the plugin's, and resolves the
     entry radius through an ancestor variable that is absent on <body>. Keep
     that cascade order here so the ghost-radius regression is reproducible. */
  .guide-entry { border-radius: var(--harness-entry-radius); }
  /* The context-menu fixtures are fixed portals like the host's; :not([hidden])
     keeps the `hidden` attribute meaningful despite the flex layout. */
  .ctx-menu { position: fixed; background: #26272b; padding: 4px; }
  .ctx-menu:not([hidden]) { display: flex; flex-direction: column; }
  .ctx-menu [class*="_viewport_"] { display: flex; flex-direction: column; }
  .ctx-menu [class*="_itemWrap_"] { display: block; }
  ._separator_ctx { flex: none; height: 1px; margin: 3px 8px; background: rgba(255, 255, 255, 0.12); }
</style>
</body>
</html>
