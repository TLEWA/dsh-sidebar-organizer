<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-sidebar-organizer harness</title>
<style>
  html, body { margin: 0; background: #17171b; color: #ddd; font: 13px/1.5 system-ui, sans-serif; }
  #stage { display: flex; flex-wrap: wrap; gap: 18px; padding: 18px; }
  .fixture { border: 1px solid #333; border-radius: 8px; padding: 8px; }
  .caption { color: #888; font-size: 11px; margin-bottom: 6px; }
  nav.sidebar { display: flex; flex-direction: column; gap: 4px; width: 180px; }
  nav.sidebar button, .footer button, .tabs button, .composer button,
  .right button, .settings button { display: flex; align-items: center; gap: 6px; min-height: 30px; }
  /* Mirrors the host tab: the bottom padding reserves the active underline. */
  .tabs button { padding: 0 0 9px; }
  .footer, .tabs, .composer, .right, .settings-list { display: flex; gap: 6px; }
  .right { --harness-entry-radius: 12px; flex-direction: column; width: 640px; min-height: 420px; justify-content: center; align-items: center; }
  /* Mirrors the shipped guide: 380px cards centered in a much wider, padded
     flex column. The drop line must follow the cards, not this container. */
  .right [data-sidebar-right-guide-entry] { width: 380px; max-width: 100%; }
  .guide-entry {
    width: 100%; border-radius: var(--harness-entry-radius);
    border: .5px solid #3a3a3f; background: #26272b; padding: 10px 14px; color: #ddd;
  }
  /* Mirrors the shipped guide's trailing spacer; it must stay after every row. */
  .right::after { content: ""; flex: 0 10%; }
  .tabs { flex-direction: row; }
  .composer { align-items: center; }
  [data-slot="conversation.composer.dock"] { display: contents; }
  [data-slot="sidebar.footer.action"] { display: flex; gap: 6px; }
  .settings nav { display: block; }
  .settings-list { flex-direction: column; width: 200px; }
  .settings-list > div { display: block; }
  #result { white-space: pre-wrap; padding: 12px 18px; font-family: ui-monospace, monospace; }
  .ok { color: #6ee7a8; }
  .bad { color: #ff7b72; }
</style>
</head>
<body>
<div id="stage">
  <div class="fixture">
    <div class="caption">sidebar.panellist</div>
    <!-- Decoy: a session/workspace nav before the real panel list. The runtime
         must not tag or reorder any of these rows. -->
    <nav class="sidebar" id="decoy" style="display:none" aria-label="会话导航">
      <button aria-label="会话A" data-testid="decoy-session-a"><span aria-hidden="true">A</span><span>会话A</span></button>
      <button aria-label="会话B" data-testid="decoy-session-b"><span aria-hidden="true">B</span><span>会话B</span></button>
      <button aria-label="会话C" data-testid="decoy-session-c"><span aria-hidden="true">C</span><span>会话C</span></button>
      <button aria-haspopup="menu" aria-label="会话更多"><span aria-hidden="true">…</span><span>会话更多</span></button>
    </nav>
    <nav class="sidebar" id="sidebar">
      <button aria-label="插件" data-testid="plugins"><span data-slot="sidebar.panellist" aria-hidden="true">P</span><span>插件</span></button>
      <button aria-label="计划" data-testid="schedules"><span aria-hidden="true">S</span><span>计划</span></button>
      <button aria-label="文件" data-testid="files"><span aria-hidden="true">F</span><span>文件</span></button>
      <button aria-label="浏览器" data-testid="browser"><span aria-hidden="true">B</span><span>浏览器</span></button>
      <button aria-label="终端" data-testid="terminal"><span aria-hidden="true">T</span><span>终端</span></button>
      <button aria-label="任务" data-testid="tasks"><span aria-hidden="true">J</span><span>任务</span></button>
      <button aria-haspopup="menu" aria-label="更多"><span aria-hidden="true">…</span><span>更多</span></button>
    </nav>
  </div>

  <div class="fixture">
    <div class="caption">sidebar "More" popup</div>
    <!-- Mirrors the real popup markup: our caption + .dso-menu-item wrappers
         around the host's MenuItemButton rows. Drag source for a tucked row. -->
    <div class="more-menu" id="more-menu" role="menu">
      <div class="dso-menu-caption">已收纳</div>
      <div class="dso-menu-item" data-dso-more-key="sidebar:tasks">
        <button type="button" class="dso-menu-row"><span aria-hidden="true">J</span><span>任务</span></button>
      </div>
    </div>
  </div>

  <div class="fixture">
    <div class="caption">sidebar.footer.action</div>
    <div data-slot="sidebar.footer.action" class="footer" id="footer">
      <button aria-haspopup="menu" aria-label="设置" data-testid="settings-entry"><span aria-hidden="true">G</span><span>设置</span></button>
      <button aria-label="帮助" data-testid="help"><span aria-hidden="true">H</span><span>帮助</span></button>
      <button aria-label="反馈" data-testid="feedback"><span aria-hidden="true">R</span><span>反馈</span></button>
      <button aria-haspopup="menu" aria-label="更多"><span aria-hidden="true">…</span><span>更多</span></button>
    </div>
  </div>

  <div class="fixture">
    <div class="caption">conversation.view</div>
    <div class="tabs-wrap" id="tabs-wrap">
      <div data-conversation-tabs class="tabs" id="tabs">
        <button role="tab" aria-label="对话" data-testid="chat"><span aria-hidden="true">C</span><span>对话</span></button>
        <button role="tab" aria-label="轨迹" data-testid="trajectory"><span aria-hidden="true">T</span><span>轨迹</span></button>
        <button role="tab" aria-label="变更" data-testid="diff"><span aria-hidden="true">D</span><span>变更</span></button>
      </div>
      <button aria-haspopup="menu" aria-label="更多标签"><span aria-hidden="true">…</span><span>更多</span></button>
    </div>
  </div>

  <div class="fixture">
    <div class="caption">conversation.composer.dock</div>
    <div class="composer" id="composer">
      <div data-slot="conversation.composer.dock">
        <button aria-label="统计" data-testid="stats"><span aria-hidden="true">S</span><span>统计</span></button>
        <button aria-label="上下文" data-testid="context"><span aria-hidden="true">C</span><span>上下文</span></button>
        <button aria-label="活动" data-testid="activity"><span aria-hidden="true">A</span><span>活动</span></button>
      </div>
      <div class="composer-tail" data-testid="composer-tail"><span>上下文用量</span></div>
      <button aria-haspopup="menu" aria-label="更多工具"><span aria-hidden="true">…</span><span>更多</span></button>
    </div>
  </div>

  <div class="fixture">
    <div class="caption">right sidebar guide</div>
    <div data-sidebar-right-guide class="right" id="right">
      <div data-sidebar-right-guide-entry="files"><button class="guide-entry"><span class="entryTitle">文件</span><span aria-hidden="true">F</span></button></div>
      <div data-sidebar-right-guide-entry="browser"><button class="guide-entry"><span class="entryTitle">浏览器</span><span aria-hidden="true">B</span></button></div>
      <div data-sidebar-right-guide-entry="new-terminal"><button class="guide-entry"><span class="entryTitle">New terminal</span><span aria-hidden="true">N</span></button></div>
      <div data-sidebar-right-guide-entry="terminal"><button class="guide-entry"><span class="entryTitle">终端</span><span aria-hidden="true">T</span></button></div>
      <div class="right-chrome" data-testid="right-chrome"><button aria-label="联动">联动</button></div>
      <button class="guide-entry" aria-haspopup="menu" aria-label="更多工具"><span class="entryTitle">更多工具</span><span aria-hidden="true">…</span></button>
    </div>
  </div>

  <div class="fixture settings" id="settings">
    <div class="caption">settings.section</div>
    <div data-shortcut-modal="settings">
      <nav>
        <div class="settings-list" id="settings-list">
          <div><button aria-label="账户"><span aria-hidden="true">A</span><span>账户</span></button></div>
          <div><button aria-label="通用"><span aria-hidden="true">G</span><span>通用</span></button></div>
          <div><button aria-label="模型"><span aria-hidden="true">M</span><span>模型</span></button></div>
          <div><button aria-label="插件"><span aria-hidden="true">P</span><span>插件</span></button></div>
          <div><button aria-label="布局整理" data-testid="layout-organizer"><span aria-hidden="true">L</span><span>布局整理</span></button></div>
          <div><button aria-label="Better Sidebar" data-testid="better-settings" data-dsh-better-sidebar-settings-nav><span aria-hidden="true">B</span><span>Better Sidebar</span></button></div>
          <div><button aria-label="关于"><span aria-hidden="true">I</span><span>关于</span></button></div>
        </div>
      </nav>
    </div>
  </div>
</div>
<div id="result">running…</div>

<script>
  const log = [];
  const failures = [];
  function note(text, ok) {
    log.push((ok ? "PASS " : "FAIL ") + text);
    if (!ok) failures.push(text);
  }
  function assert(name, condition, extra) {
    note(name + (condition ? "" : " — " + (extra === undefined ? "" : String(extra))), !!condition);
  }
  function wait(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
  function orderOf(scope) {
    return Array.from(document.querySelectorAll('[data-dso-scope="' + scope + '"]'))
      .filter((node) => !node.dataset.dsoHidden)
      .sort((a, b) => Number(a.style.order) - Number(b.style.order))
      .map((node) => node.dataset.dsoKey);
  }

  // Minimal React surface: enough for createMenuEntry/createSettingsPage to
  // register real components; the runtime tests below never render them.
  const ReactStub = {
    createElement() { return {}; },
    useState() { return [0, function () {}]; },
    useEffect() {},
    useRef() { return { current: null }; },
    Fragment: "fragment",
    Component: class { constructor(props) { this.props = props; this.state = {}; } },
  };
  const slots = new Map();
  function addEntry(slot, options) {
    if (!slots.has(slot)) slots.set(slot, []);
    slots.get(slot).push({ options });
  }
  addEntry("sidebar.panellist", { id: "plugins", label: "插件" });
  addEntry("sidebar.panellist", { id: "schedules", label: "计划" });
  addEntry("sidebar.panellist", { id: "files", label: "文件" });
  addEntry("sidebar.panellist", { id: "browser", label: "浏览器" });
  addEntry("sidebar.panellist", { id: "terminal", label: "终端" });
  addEntry("sidebar.panellist", { id: "tasks", label: "任务" });
  addEntry("sidebar.footer.action", { id: "footer-settings", label: "设置" });
  addEntry("sidebar.footer.action", { id: "footer-help", label: "帮助" });
  addEntry("sidebar.footer.action", { id: "footer-feedback", label: "反馈" });
  addEntry("conversation.view", { id: "chat", label: "对话" });
  addEntry("conversation.view", { id: "trajectory", label: "轨迹" });
  addEntry("conversation.view", { id: "diff", label: "变更" });
  addEntry("conversation.composer.dock", { id: "stats", label: "统计" });
  addEntry("conversation.composer.dock", { id: "context", label: "上下文" });
  addEntry("conversation.composer.dock", { id: "activity", label: "活动" });
  addEntry("settings.section", { id: "account", label: "账户" });
  addEntry("settings.section", { id: "general", label: "通用" });
  addEntry("settings.section", { id: "models", label: "模型" });
  addEntry("settings.section", { id: "plugins", label: "插件" });
  addEntry("settings.section", { id: "better", label: "Better Sidebar" });
  addEntry("settings.section", { id: "about", label: "关于" });

  const ctx = {
    logger: { debug() {}, info() {}, warn() {} },
    effect(fn) { this.__cleanup = fn(); return () => this.__cleanup && this.__cleanup(); },
    slots: {
      entriesOfSlot(slot) { return (slots.get(slot) || []).slice(); },
      inject(slot, callback) { callback(); },
      register() { throw new Error("register used outside inject"); },
    },
  };
  // register needs the slot name; wrap it with the inject closure.
  ctx.slots.inject = function (slot, callback) {
    const previous = ctx.slots.register;
    ctx.slots.register = function (options, component) {
      addEntry(slot, options);
      if (slot === "settings.section") {
        // make the host render our settings row, like the real settings nav
        const list = document.getElementById("settings-list");
        if (list && !document.querySelector('[data-testid="layout-organizer"]')) {
          const wrapper = document.createElement("div");
          const button = document.createElement("button");
          button.setAttribute("aria-label", "布局整理");
          button.dataset.testid = "layout-organizer";
          button.innerHTML = '<span aria-hidden="true">L</span><span>布局整理</span>';
          wrapper.appendChild(button);
          list.appendChild(wrapper);
        }
      }
      return { dispose() {} };
    };
    callback();
    ctx.slots.register = previous;
  };

  // v3 layout. The sidebar part is the shape a v2 flat layout migrates to;
  // the right part deliberately reproduces the 0.5.4 bug where a newly
  // discovered entry ("new-terminal") was persisted at the end instead of at
  // its host position. The one-shot repair must move it back.
  localStorage.clear();
  localStorage.setItem("dsh.sidebar-organizer.layout.v1", JSON.stringify({
    version: 3,
    scopes: {
      sidebar: {
        order: ["terminal", "browser", "files", "plugins", "schedules", "tasks"],
        hidden: ["tasks"],
      },
      right: {
        order: ["files", "browser", "terminal", "new-terminal"],
        hidden: [],
      },
    },
  }));

  window.__ModuleLoader__ = {
    load({ factory }) {
      window.__plugin = factory(function require(name) {
        if (name === "react") return ReactStub;
        if (name === "@deepseek-ai/dsh-client-ui-primitives") return {};
        return null;
      });
    },
  };

  const result = document.getElementById("result");
  function finish() {
    const passed = failures.length === 0;
    result.innerHTML = log.map((line) =>
      '<div class="' + (line.startsWith("PASS") ? "ok" : "bad") + '">' + line + "</div>"
    ).join("");
    result.insertAdjacentHTML("afterbegin", '<div class="' + (passed ? "ok" : "bad") + '"><b>' + (passed ? "ALL PASS" : failures.length + " FAILURE(S)") + "</b></div>");
    window.__harnessLog = log;
    window.__harnessFailures = failures;
    window.__harnessDone = true;
  }

  (async function run() {
    try {
      await new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = "../lib/client.js";
        script.onload = resolve;
        script.onerror = () => { note("load lib/client.js", false); resolve(); };
        document.head.appendChild(script);
      });
      if (!window.__plugin) throw new Error("bundle did not register a module");
      window.__plugin.apply(ctx);
      const api = window.__dshSidebarOrganizer;
      assert("plugin handle exists", !!api);
      await wait(250);

      let status = api.status();
      assert("sidebar scope found", status.scopes.sidebar.found, JSON.stringify(status.scopes.sidebar));
      assert("footer scope found", status.scopes.footer.found);
      assert("tabs scope found", status.scopes.tabs.found);
      assert("composer scope found", status.scopes.composer.found);
      assert("right scope found", status.scopes.right.found);
      assert("settings scope found", status.scopes.settings.found);
      assert("sidebar has 6 rows", status.scopes.sidebar.rows.length === 6, status.scopes.sidebar.rows.length);
      const decoy = document.getElementById("decoy");
      assert("sidebar ignores decoy nav rows", !!decoy && !decoy.querySelector("[data-dso-key]") && !decoy.querySelector('[style*="order"]'));
      assert("sidebar marks only direct panel rows", document.querySelectorAll("#sidebar > [data-dso-key]").length === 6);
      assert("footer has 3 rows", status.scopes.footer.rows.length === 3);
      assert("footer keeps menu-trigger rows that are not More", status.scopes.footer.rows.some((row) => row.id === "footer-settings"), status.scopes.footer.rows.map((row) => row.id).join(","));
      assert("right has 4 guide rows", status.scopes.right.rows.length === 4, status.scopes.right.rows.length);
      assert("right ignores non-entry chrome", status.scopes.right.rows.every((row) => row.id !== "right-chrome"));
      assert("composer ignores host chrome beside the outlet", status.scopes.composer.rows.length === 3, status.scopes.composer.rows.length);
      const composerTail = document.querySelector('[data-testid="composer-tail"]');
      assert("composer tail is not a row", !composerTail.hasAttribute("data-dso-key"));
      assert("composer tail is pinned after rows", Number(composerTail.style.order) > 1000, composerTail.style.order);
      assert("settings has 7 rows", status.scopes.settings.rows.length === 7, status.scopes.settings.rows.length);

      const stored = JSON.parse(localStorage.getItem("dsh.sidebar-organizer.layout.v1"));
      assert("storage upgraded to v3", stored && stored.version === 3, JSON.stringify(stored));
      assert("sidebar preset order preserved", stored.scopes.sidebar.order[0] === "terminal", JSON.stringify(stored.scopes.sidebar));
      assert("sidebar preset hidden preserved", stored.scopes.sidebar.hidden.indexOf("tasks") !== -1);
      assert("first visible row is terminal", orderOf("sidebar")[0] === "terminal", orderOf("sidebar").join(","));
      assert(
        "right repairs persisted trailing new entry",
        orderOf("right").join(",") === "files,browser,new-terminal,terminal",
        orderOf("right").join(",")
      );

      // Dragging a row out of the shipped "More" popup must keep a dimmed
      // placeholder at the row's original spot, exactly like a sidebar row.
      // 0.5.6 and earlier set that source row to opacity 0, so the popup row
      // vanished and only the ghost was left.
      const menuRow = document.querySelector('[data-dso-more-key="sidebar:tasks"]');
      const tasksRow = document.querySelector('[data-testid="tasks"]');
      assert("More popup fixture is present", !!menuRow && !!tasksRow);
      assert("tasks starts tucked away", tasksRow.dataset.dsoHidden === "1");
      const menuRect0 = menuRow.getBoundingClientRect();
      const menuX = menuRect0.left + menuRect0.width / 2;
      const menuY = menuRect0.top + menuRect0.height / 2;
      // The popup only holds this one row, so there is no other row to anchor
      // the line against. 0.5.7 fell back to the raw pointer y, which drew a
      // full-width line straight through "任务". It belongs on the row's edge.
      const singleY = menuRect0.top + menuRect0.height * 0.78;
      menuRow.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 21,
        clientX: menuX, clientY: menuY,
      }));
      await wait(330);
      assert("menu row starts a drag", menuRow.classList.contains("dso-dragging"));
      const placeholderOpacity = Number(getComputedStyle(menuRow).opacity);
      assert(
        "menu source stays as a dimmed placeholder",
        placeholderOpacity > 0.25 && placeholderOpacity < 0.5,
        placeholderOpacity
      );
      assert("menu source keeps its layout slot", menuRow.getBoundingClientRect().height > 0);
      document.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, cancelable: true, pointerId: 21,
        clientX: menuX, clientY: singleY,
      }));
      const singleIndicator = document.querySelector(".dso-indicator");
      assert("single tucked row shows its drop line", !!singleIndicator && singleIndicator.dataset.visible === "1");
      assert(
        "single tucked row anchors the line above itself",
        Math.abs(parseFloat(singleIndicator.style.top) - (menuRect0.top - 1)) <= 1,
        `${singleIndicator.style.top} vs ${menuRect0.top}`
      );
      document.dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, cancelable: true, pointerId: 21,
        clientX: menuX, clientY: singleY,
      }));
      await wait(520);
      assert("in-popup drop keeps the row tucked", !!tasksRow.dataset.dsoHidden);
      menuRow.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 21,
        clientX: menuX, clientY: menuY,
      }));
      await wait(330);
      assert("menu row still starts a drag", menuRow.classList.contains("dso-dragging"));
      const browserRect = document.querySelector('[data-testid="browser"]').getBoundingClientRect();
      const dropSideX = browserRect.left + browserRect.width / 2;
      const dropSideY = browserRect.top + browserRect.height / 4;
      document.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, cancelable: true, pointerId: 21,
        clientX: dropSideX, clientY: dropSideY,
      }));
      const menuIndicator = document.querySelector(".dso-indicator");
      assert("menu drag over the sidebar shows the drop line", !!menuIndicator && menuIndicator.dataset.visible === "1");
      document.dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, cancelable: true, pointerId: 21,
        clientX: dropSideX, clientY: dropSideY,
      }));
      await wait(80);
      assert("menu drop reveals the tucked row", !tasksRow.dataset.dsoHidden);
      assert("menu drop clears the placeholder", !menuRow.classList.contains("dso-dragging"));
      // A drop arms the 500 ms click guard; let it lapse so the later
      // activate/click assertions below are not swallowed by it.
      await wait(520);

      api.reorder("footer", "footer-feedback", 0);
      assert("footer reorder writes state", orderOf("footer")[0] === "footer-feedback", orderOf("footer").join(","));

      assert("hide composer stats", api.hide("composer", "stats") === true);
      assert("composer stats hidden in DOM", document.querySelector('[data-testid="stats"]').dataset.dsoHidden === "1");
      const conversationHidden = api.hiddenForRegion("conversation");
      assert("conversation region lists hidden row", conversationHidden.some((row) => row.scope === "composer" && row.id === "stats"), JSON.stringify(conversationHidden));

      let clicks = 0;
      document.querySelector('[data-testid="stats"]').addEventListener("click", () => { clicks += 1; });
      assert("activate hidden row", api.activate("composer", "stats") === true);
      assert("activate clicks the row", clicks === 1);

      api.resetRegion("conversation");
      assert("resetRegion unhides the composer row", !document.querySelector('[data-testid="stats"]').dataset.dsoHidden);
      assert("resetRegion clears conversation customization", api.isCustomizedRegion("conversation") === false);
      assert("resetRegion leaves other regions alone", orderOf("footer")[0] === "footer-feedback", orderOf("footer").join(","));

      const settingsMore = document.querySelector("#settings-list > .dso-settings-more");
      assert("settings nav has a More anchor", !!settingsMore);
      assert("settings More is hidden while nothing is tucked", settingsMore && getComputedStyle(settingsMore).display === "none", settingsMore && getComputedStyle(settingsMore).display);
      assert("settings own row cannot be tucked away", api.hide("settings", "layout-organizer") === false);
      assert("settings own row can be reordered", api.reorder("settings", "layout-organizer", 0) === true);
      assert("settings own row moves to the top", api.snapshot().find((scope) => scope.scope === "settings").rows[0].id === "layout-organizer", api.snapshot().find((scope) => scope.scope === "settings").rows.map((row) => row.id).join(","));
      api.resetScope("settings");
      assert("better-sidebar settings row cannot be hidden", api.hide("settings", "better") === false);
      assert("better-sidebar settings row stays fixed", api.reorder("settings", "better", 0) === false);
      let snap = api.snapshot().find((scope) => scope.scope === "settings");
      assert("snapshot marks fixed settings row", snap.rows.find((row) => row.id === "better").fixed === true);
      assert("snapshot keeps own row movable", snap.rows.find((row) => row.id === "layout-organizer").fixed === false && snap.rows.find((row) => row.id === "layout-organizer").pinned === true);
      assert("can hide another settings row", api.hide("settings", "account") === true);
      snap = api.snapshot().find((scope) => scope.scope === "settings");
      assert("snapshot marks hidden settings row", snap.rows.find((row) => row.id === "account").hidden === true);
      assert("settings More appears once a row is tucked", getComputedStyle(settingsMore).display !== "none", getComputedStyle(settingsMore).display);
      // The More popup lists tucked rows; picking one activates the real nav row.
      let accountClicks = 0;
      document.querySelector('[data-dso-key="account"]').addEventListener("click", () => { accountClicks += 1; });
      settingsMore.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
      const settingsMenu = document.querySelector(".dso-settings-more-menu");
      assert("settings More opens its popup", !!settingsMenu);
      const settingsMenuItem = settingsMenu && settingsMenu.querySelector('[data-dso-more-key="settings:account"]');
      assert("settings popup lists the tucked row", !!settingsMenuItem && settingsMenuItem.textContent === "账户");
      settingsMenuItem.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
      assert("settings popup activates the row", accountClicks === 1);
      assert("settings popup closes after activation", !document.querySelector(".dso-settings-more-menu"));
      assert("restore settings row", api.reveal("settings", "account") === true);
      assert("settings More hides again when the shelf is empty", getComputedStyle(settingsMore).display === "none", getComputedStyle(settingsMore).display);

      api.resetScope("footer");
      assert("resetScope restores DOM order", orderOf("footer").join(",") === "footer-settings,footer-help,footer-feedback", orderOf("footer").join(","));

      api.setDragEnabled("footer", false);
      assert("drag toggle is stored", api.isDragEnabled("footer") === false);
      const disabledRow = document.querySelector('[data-testid="feedback"]');
      const disabledRect = disabledRow.getBoundingClientRect();
      disabledRow.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 9,
        clientX: disabledRect.left + disabledRect.width / 2,
        clientY: disabledRect.top + disabledRect.height / 2,
      }));
      await wait(330);
      assert("disabled scope does not start a drag", !document.querySelector(".dso-ghost"));
      assert("disabled scope leaves the row unpressed", !disabledRow.classList.contains("dso-pressing"));
      api.setDragEnabled("footer", true);
      assert("drag toggle can be re-enabled", api.isDragEnabled("footer") === true);

      // A plain click must not look like a long-press: the old code added the
      // press-scale class immediately on pointerdown, so every normal click
      // briefly shrank the row.
      const shortPressRow = document.querySelector('[data-testid="help"]');
      const shortRect = shortPressRow.getBoundingClientRect();
      shortPressRow.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 11,
        clientX: shortRect.left + shortRect.width / 2,
        clientY: shortRect.top + shortRect.height / 2,
      }));
      await wait(60);
      assert("short press does not shrink the row", !shortPressRow.classList.contains("dso-pressing"));
      document.dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, cancelable: true, pointerId: 11,
        clientX: shortRect.left + shortRect.width / 2,
        clientY: shortRect.top + shortRect.height / 2,
      }));
      await wait(20);

      // The drop line must sit in the middle of the visual gap. When the
      // source is excluded, its old slot still provides the right-hand edge;
      // anchoring to the last remaining row's edge puts the line inside the
      // tab text (the "轨迹" offset reported in the real app).
      api.resetScope("tabs");
      const tabTrajectory = document.querySelector('[data-testid="trajectory"]');
      const tabDiff = document.querySelector('[data-testid="diff"]');
      const trajRect = tabTrajectory.getBoundingClientRect();
      const diffRect = tabDiff.getBoundingClientRect();
      const tabFromY = diffRect.top + diffRect.height / 2;
      tabDiff.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 12,
        clientX: diffRect.left + diffRect.width / 2, clientY: tabFromY,
      }));
      await wait(330);
      const tabDropX = (trajRect.right + diffRect.left) / 2;
      document.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, cancelable: true, pointerId: 12,
        clientX: tabDropX, clientY: tabFromY,
      }));
      const tabIndicator = document.querySelector(".dso-indicator");
      const tabIndicatorX = tabIndicator ? parseFloat(tabIndicator.style.left) + 1 : NaN;
      assert("tabs indicator sits in the host gap", Math.abs(tabIndicatorX - tabDropX) <= 1.5, `${tabIndicatorX} vs ${tabDropX}`);
      // The host tab reserves 9px at the bottom for its active underline, so
      // its padding box is taller than the label row. The line must center on
      // the label content, otherwise it looks a few pixels low (0.5.7 bug).
      const tabStyle = getComputedStyle(tabDiff);
      const tabPadTop = parseFloat(tabStyle.paddingTop) || 0;
      const tabPadBottom = parseFloat(tabStyle.paddingBottom) || 0;
      const tabContentTop = diffRect.top + tabPadTop;
      const tabContentHeight = diffRect.height - tabPadTop - tabPadBottom;
      const tabIndicatorTop = tabIndicator ? parseFloat(tabIndicator.style.top) : NaN;
      const tabIndicatorHeight = tabIndicator ? parseFloat(tabIndicator.style.height) : NaN;
      assert(
        "tabs indicator centers on the label row",
        Math.abs(tabIndicatorTop - tabContentTop) <= 0.5 && Math.abs(tabIndicatorHeight - tabContentHeight) <= 0.5,
        `top ${tabIndicatorTop} vs ${tabContentTop}, height ${tabIndicatorHeight} vs ${tabContentHeight}`
      );
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      document.dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, cancelable: true, pointerId: 12,
        clientX: tabDropX, clientY: tabFromY,
      }));
      await wait(20);

      // The host unmounts every tab past its overflow limit when the pane
      // narrows, then remounts fresh buttons on widen. A tucked tab must stay
      // tucked across that gap: 0.5.7 pruned absent ids out of `hidden`, so the
      // remounted tab came back visible ("宽度缩短再变长后跑出来").
      api.resetScope("tabs");
      assert("can tuck a tab before the host narrows", api.hide("tabs", "diff") === true);
      const diffHost = tabDiff.parentElement;
      const diffNext = tabDiff.nextSibling;
      tabDiff.remove();
      await wait(80);
      assert(
        "absent tab stays in hidden state",
        api.status().scopes.tabs.hidden.indexOf("diff") !== -1,
        JSON.stringify(api.status().scopes.tabs.hidden)
      );
      // The host stops rendering overflow tabs when the pane narrows, so the
      // tab is gone from the DOM while still registered. It must keep showing
      // up under 已收纳 instead of disappearing from the menu (and later
      // leaking back as a plain host row).
      const foldedHidden = api.hiddenForRegion("conversation");
      assert(
        "folded tucked tab stays listed under 已收纳",
        foldedHidden.some((row) => row.scope === "tabs" && row.id === "diff"),
        JSON.stringify(foldedHidden)
      );
      assert(
        "hiddenIds reports folded tucked tab",
        api.hiddenIds("tabs").indexOf("diff") !== -1,
        JSON.stringify(api.hiddenIds("tabs"))
      );
      tabDiff.removeAttribute("style");
      delete tabDiff.dataset.dsoKey;
      delete tabDiff.dataset.dsoScope;
      delete tabDiff.dataset.dsoHidden;
      diffHost.insertBefore(tabDiff, diffNext);
      await wait(80);
      assert(
        "remounted tab stays tucked away",
        tabDiff.dataset.dsoHidden === "1" && getComputedStyle(tabDiff).display === "none",
        `hidden=${tabDiff.dataset.dsoHidden} display=${getComputedStyle(tabDiff).display}`
      );
      api.resetScope("tabs");

      // Make visual order (feedback, settings, help) differ from DOM order
      // (settings, help, feedback). The next drop must use the visual order;
      // using DOM order lands help before feedback instead of between them.
      api.reorder("footer", "footer-feedback", 0);
      assert("footer visual order diverges from DOM", orderOf("footer").join(",") === "footer-feedback,footer-settings,footer-help", orderOf("footer").join(","));

      const help = document.querySelector('[data-testid="help"]');
      const settingsRow = document.querySelector('[data-testid="settings-entry"]');
      // Mimic a host row that ships inline positioning/state styles. The ghost
      // must be sanitized, otherwise the clone is pinned to the host layout.
      help.style.position = "relative";
      help.style.transform = "translateY(3px)";
      help.setAttribute("aria-current", "page");
      const from = help.getBoundingClientRect();
      const to = settingsRow.getBoundingClientRect();
      const dropX = to.left + to.width * 0.2;
      const dropY = to.top + to.height / 2;
      // Simulate a host sheet that pins the dragged row's own class to
      // position: relative. The real tab bar does exactly this (0.5.7 shipped
      // a ghost that fell to the bottom of the page and added a scrollbar).
      const hostOverride = document.createElement("style");
      hostOverride.textContent = ".dso-ghost { position: relative; }";
      document.head.appendChild(hostOverride);
      help.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 1,
        clientX: from.left + from.width / 2, clientY: from.top + from.height / 2,
      }));
      await wait(330);
      document.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, cancelable: true, pointerId: 1,
        clientX: dropX, clientY: dropY,
      }));
      const ghost = document.querySelector(".dso-ghost");
      assert("drag creates a fixed ghost", !!ghost && getComputedStyle(ghost).position === "fixed");
      assert("ghost ignores late host position rules", !!ghost && getComputedStyle(ghost).position === "fixed" && ghost.style.getPropertyPriority("position") === "important");
      assert("ghost drops host inline style", !!ghost && ghost.style.transform === "" && ghost.style.order === "", ghost && ghost.style.cssText);
      assert("ghost drops host state marks", !!ghost && !ghost.hasAttribute("aria-current") && !ghost.hasAttribute("data-dso-key"));
      hostOverride.remove();
      assert("drag dims the source row", help.classList.contains("dso-dragging"));
      document.dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, cancelable: true, pointerId: 1,
        clientX: dropX, clientY: dropY,
      }));
      await wait(80);
      help.style.position = "";
      help.style.transform = "";
      help.removeAttribute("aria-current");
      assert("drop index follows visual order", orderOf("footer").join(",") === "footer-feedback,footer-help,footer-settings", orderOf("footer").join(","));

      // Same check on the vertical sidebar, where the dragged row sits between
      // visual neighbors but not between DOM neighbors.
      api.resetScope("sidebar");
      api.reorder("sidebar", "terminal", 0);
      const plugins = document.querySelector('[data-testid="plugins"]');
      const browserRow = document.querySelector('[data-testid="browser"]');
      const pFrom = plugins.getBoundingClientRect();
      const bTo = browserRow.getBoundingClientRect();
      const sideX = pFrom.left + pFrom.width / 2;
      const sideY = bTo.top + bTo.height * 0.25;
      plugins.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 2,
        clientX: sideX, clientY: pFrom.top + pFrom.height / 2,
      }));
      await wait(330);
      document.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, cancelable: true, pointerId: 2,
        clientX: sideX, clientY: sideY,
      }));
      document.dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, cancelable: true, pointerId: 2,
        clientX: sideX, clientY: sideY,
      }));
      await wait(80);
      assert("sidebar drop follows visual order", orderOf("sidebar").slice(0, 5).join(",") === "terminal,schedules,files,plugins,browser", orderOf("sidebar").join(","));

      // Regression (0.5.7): the right guide is a full-width, centered flex
      // column holding 380px cards. Using the container rect for the drop line
      // stretched it across the entire app; cloning the button to <body> lost
      // the ancestor's --dsl-guide-entry-radius and made the ghost square.
      const rightFixture = document.getElementById("right");
      const rightFiles = rightFixture.querySelector('[data-sidebar-right-guide-entry="files"] button');
      const rightTerminal = rightFixture.querySelector('[data-sidebar-right-guide-entry="terminal"] button');
      const rightFileRect = rightFiles.getBoundingClientRect();
      const rightTermRect = rightTerminal.getBoundingClientRect();
      assert("right guide is wider than its cards", rightFixture.getBoundingClientRect().width > rightFileRect.width + 100);
      rightTerminal.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 31,
        clientX: rightTermRect.left + rightTermRect.width / 2,
        clientY: rightTermRect.top + rightTermRect.height / 2,
      }));
      await wait(330);
      const rightGhost = document.querySelector(".dso-ghost");
      const rightGhostRadius = rightGhost ? parseFloat(getComputedStyle(rightGhost).borderTopLeftRadius) : NaN;
      assert("right guide drag creates a ghost", !!rightGhost);
      assert(
        "right guide ghost keeps the host corner radius",
        rightGhostRadius >= 11,
        `radius ${rightGhostRadius}`
      );
      document.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, cancelable: true, pointerId: 31,
        clientX: rightFileRect.left + rightFileRect.width / 2,
        clientY: rightFileRect.top + rightFileRect.height * 0.25,
      }));
      const rightIndicator = document.querySelector(".dso-indicator");
      const rightIndicatorLeft = rightIndicator ? parseFloat(rightIndicator.style.left) : NaN;
      const rightIndicatorWidth = rightIndicator ? parseFloat(rightIndicator.style.width) : NaN;
      assert(
        "right guide drop line spans the cards, not the container",
        Math.abs(rightIndicatorWidth - (rightFileRect.width - 8)) <= 1 &&
          Math.abs(rightIndicatorLeft - (rightFileRect.left + 4)) <= 1,
        `left ${rightIndicatorLeft} width ${rightIndicatorWidth}, card ${rightFileRect.left}/${rightFileRect.width}, container ${rightFixture.getBoundingClientRect().width}`
      );
      document.dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, cancelable: true, pointerId: 31,
        clientX: rightFileRect.left + rightFileRect.width / 2,
        clientY: rightFileRect.top + rightFileRect.height * 0.25,
      }));
      await wait(80);

      // Regression: dropping a component onto the "More" anchor must only tuck
      // it away. The hide commit animates the ghost for 180 ms before
      // endGesture() arms the click guard, so the browser's click (dispatched
      // right on pointerup, retargeted to the captured source row) used to slip
      // through and activate the component. The pointerup must arm the guard
      // before the commit, not after the animation.
      api.resetScope("right");
      await wait(40);
      const rightMore = rightFixture.querySelector('button.guide-entry[aria-haspopup="menu"]');
      const termForMore = rightFixture.querySelector('[data-sidebar-right-guide-entry="terminal"] button');
      assert("right guide More anchor is present", !!rightMore && !!termForMore);
      const termForMoreRect = termForMore.getBoundingClientRect();
      const moreDropRect = rightMore.getBoundingClientRect();
      const moreDropX = moreDropRect.left + moreDropRect.width / 2;
      const moreDropY = moreDropRect.top + moreDropRect.height / 2;
      let moreSourceClicks = 0;
      const onMoreSourceClick = () => { moreSourceClicks += 1; };
      termForMore.addEventListener("click", onMoreSourceClick);
      termForMore.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 41,
        clientX: termForMoreRect.left + termForMoreRect.width / 2,
        clientY: termForMoreRect.top + termForMoreRect.height / 2,
      }));
      await wait(330);
      document.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, cancelable: true, pointerId: 41,
        clientX: moreDropX, clientY: moreDropY,
      }));
      assert("More drop arms the anchor", rightMore.classList.contains("dso-drop-more"));
      document.dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, cancelable: true, pointerId: 41,
        clientX: moreDropX, clientY: moreDropY,
      }));
      // Same tick as the real pointerup: dispatch the click the browser would
      // synthesize while the absorb animation is still running.
      termForMore.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
      assert("drop onto More swallows the follow-up click", moreSourceClicks === 0, moreSourceClicks);
      termForMore.removeEventListener("click", onMoreSourceClick);
      await wait(300);
      assert("drop onto More tucks the row", termForMore.dataset.dsoHidden === "1", termForMore.dataset.dsoHidden);
      // Let the one-shot guard lapse so the click assertions further down are
      // not swallowed by it.
      await wait(520);
      // Restore the section: later checks use this row as a visible row.
      api.resetScope("right");
      await wait(40);

      // A plugin registered after us can add a right-guide entry. It must keep
      // the host's insertion point, not get appended below every old row.
      const rightGuide = document.getElementById("right");
      const terminalCell = rightGuide.querySelector('[data-sidebar-right-guide-entry="terminal"]');
      const addedCell = document.createElement("div");
      addedCell.setAttribute("data-sidebar-right-guide-entry", "dynamic-terminal");
      addedCell.innerHTML = '<button class="guide-entry" aria-label="新建终端"><span class="entryTitle">新建终端</span></button>';
      rightGuide.insertBefore(addedCell, terminalCell);
      api.refresh();
      await wait(30);
      const rightOrder = orderOf("right");
      assert(
        "new right-guide entry keeps its host position",
        rightOrder.indexOf("dynamic-terminal") !== -1 && rightOrder.indexOf("dynamic-terminal") < rightOrder.indexOf("terminal"),
        rightOrder.join(",")
      );
      assert("right-guide chrome stays after entry rows", Number(document.querySelector('[data-testid="right-chrome"]').style.order) > 1000, document.querySelector('[data-testid="right-chrome"]').style.order);

      // Regression: the host guide ends with a 10%-tall ::after spacer. Rows
      // carry order values, so a spacer left at order 0 would sort between the
      // first child and the rows and open a blank band (0.5.5 and earlier).
      const guideSpacer = Number(getComputedStyle(rightGuide, "::after").order);
      const lastRowOrder = Number(rightGuide.querySelector("[data-dso-key]").style.order);
      assert(
        "right-guide spacer stays after every ordered row",
        guideSpacer > lastRowOrder && guideSpacer > 1000,
        `spacer ${guideSpacer} vs row ${lastRowOrder}`
      );

      // Configuration export/import: the file carries both the layout and the
      // per-section drag switches. A version mismatch is rejected whole, so a
      // foreign snapshot cannot half-apply over the current layout.
      api.reset();
      api.reorder("footer", "footer-feedback", 0);
      api.hide("tabs", "diff");
      api.setDragEnabled("right", false);
      const exported = api.exportConfig();
      assert("export carries a format marker", exported.format === "dsh-sidebar-organizer", exported.format);
      assert("export carries the state version", exported.version === 3, exported.version);
      assert(
        "export carries the current layout",
        exported.scopes.footer.order[0] === "footer-feedback" && exported.scopes.tabs.hidden.indexOf("diff") !== -1,
        JSON.stringify(exported.scopes)
      );
      assert(
        "export carries every drag switch",
        exported.drag.right === false && exported.drag.sidebar === true && Object.keys(exported.drag).length === 6,
        JSON.stringify(exported.drag)
      );

      api.reset();
      api.setDragEnabled("right", true);
      assert("reset clears the layout before import", orderOf("footer")[0] !== "footer-feedback", orderOf("footer").join(","));
      const imported = api.importConfig(JSON.stringify(exported));
      assert("import accepts the exported JSON", imported.ok === true, JSON.stringify(imported));
      assert("import restores visual order", orderOf("footer")[0] === "footer-feedback", orderOf("footer").join(","));
      assert("import restores tucked rows", document.querySelector('[data-testid="diff"]').dataset.dsoHidden === "1");
      assert("import restores drag switches", api.isDragEnabled("right") === false, api.isDragEnabled("right"));

      const beforeBadImport = JSON.stringify(api.status());
      const wrongVersion = api.importConfig(Object.assign({}, exported, { version: 99 }));
      assert("wrong-version import is rejected", wrongVersion.ok === false && wrongVersion.reason === "version", JSON.stringify(wrongVersion));
      assert("wrong-version import leaves state untouched", JSON.stringify(api.status()) === beforeBadImport);
      const malformed = api.importConfig({ version: 3 });
      assert("malformed import is rejected", malformed.ok === false && malformed.reason === "shape", JSON.stringify(malformed));
      const badJson = api.importConfig("{not json");
      assert("invalid JSON is rejected", badJson.ok === false && badJson.reason === "json", JSON.stringify(badJson));

      // Regression: startup discovery is incremental. An early pass used to
      // prune rows it had not discovered yet from the saved order, so the
      // remaining rows were written back as a partial order; each row that
      // mounted later then looked new and was inserted at its host position,
      // silently discarding the user's custom order after a reload. Remembered
      // ids must survive a pass that sees only part of the list.
      api.resetScope("sidebar");
      api.reorder("sidebar", "plugins", 2);
      const customSidebar = "schedules,files,plugins,browser,terminal,tasks";
      assert("sidebar custom order is persisted", orderOf("sidebar").join(",") === customSidebar, orderOf("sidebar").join(","));
      const sidebarHost = document.getElementById("sidebar");
      const delayedPlugins = document.querySelector('[data-testid="plugins"]');
      const delayedFiles = document.querySelector('[data-testid="files"]');
      const delayedPluginsNext = delayedPlugins.nextSibling;
      const delayedFilesNext = delayedFiles.nextSibling;
      delayedPlugins.remove();
      delayedFiles.remove();
      api.refresh();
      const partialStored = JSON.parse(localStorage.getItem("dsh.sidebar-organizer.layout.v1")).scopes.sidebar;
      assert(
        "an early pass keeps undiscovered rows in the saved order",
        partialStored.order.join(",") === customSidebar,
        partialStored.order.join(",")
      );
      for (const node of [delayedPlugins, delayedFiles]) {
        node.removeAttribute("style");
        delete node.dataset.dsoKey;
        delete node.dataset.dsoScope;
        delete node.dataset.dsoHidden;
      }
      sidebarHost.insertBefore(delayedPlugins, delayedPluginsNext);
      sidebarHost.insertBefore(delayedFiles, delayedFilesNext);
      api.refresh();
      await wait(80);
      assert(
        "custom sidebar order survives a partial discovery pass",
        orderOf("sidebar").join(",") === customSidebar,
        orderOf("sidebar").join(",")
      );
      api.resetScope("sidebar");

      // Leave drag switches and layout in their default state for dispose.
      api.setDragEnabled("right", true);
      api.reset();

      api.dispose();
      assert("dispose clears row marks", document.querySelectorAll("[data-dso-key]").length === 0);
      assert("dispose restores order", document.querySelector('[data-testid="feedback"]').style.order === "", 'order=' + document.querySelector('[data-testid="feedback"]').style.order);
    } catch (error) {
      note("uncaught: " + (error && error.stack ? error.stack : error), false);
    } finally {
      finish();
    }
  })();
</script>
<style>
  /* The real host sheet is installed after the plugin's, and resolves the
     entry radius through an ancestor variable that is absent on <body>. Keep
     that cascade order here so the ghost-radius regression is reproducible. */
  .guide-entry { border-radius: var(--harness-entry-radius); }
</style>
</body>
</html>
