<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-modmenu harness</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #18181b; color: #e4e4e7; }
      .shell { width: 260px; padding: 12px; }
      .wtg9ga_panelList { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
      .wtg9ga_panelRow {
        display: flex; align-items: center; gap: 8px; min-height: 36px;
        margin: 0 2px; padding: 7px 8px; line-height: 22px; font: inherit;
        color: #e4e4e7; background: 0 0; border: none; border-radius: 6px;
        cursor: pointer; text-align: left;
      }
      .wtg9ga_panelRow:hover { background: #27272a; }
      .wtg9ga_panelGlyph { display: inline-flex; width: 18px; justify-content: center; }
      .wtg9ga_panelTitle { flex: 1; }
      #log { position: fixed; right: 12px; top: 12px; width: 520px; font: 12px/1.5 monospace;
             white-space: pre-wrap; background: #09090b; border: 1px solid #3f3f46;
             border-radius: 8px; padding: 10px; max-height: 90vh; overflow: auto; }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="wtg9ga_panelList" aria-label="全局面板" id="nav"></nav>
    </div>
    <pre id="log">booting</pre>

    <script>
      // --- fake module loader -------------------------------------------------
      window.__loadedModules = {};
      window.__ModuleLoader__ = {
        load({ id, factory }) {
          const plugin = factory((name) => {
            throw new Error("harness does not provide module: " + name);
          });
          window.__loadedModules[id] = plugin;
          window.__plugin = plugin;
        },
      };
    </script>
    <script src="../lib/client.js"></script>
    <script>
      const ENTRIES = [
        ["plugins", "插件"],
        ["dsh-market", "插件市场"],
        ["skills-manager", "技能"],
        ["schedules", "定时任务"],
        ["dsh-context", "上下文"],
        ["mcp-connector", "MCP 连接器"],
      ];

      const nav = document.getElementById("nav");
      for (const [, label] of ENTRIES) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "wtg9ga_panelRow";
        button.setAttribute("aria-label", label);
        const glyph = document.createElement("span");
        glyph.className = "wtg9ga_panelGlyph";
        glyph.textContent = "\u25c9";
        const title = document.createElement("span");
        title.className = "wtg9ga_panelTitle";
        title.textContent = label;
        button.append(glyph, title);
        button.addEventListener("click", () => log("click fired on " + label));
        nav.appendChild(button);
      }
      nav.appendChild(moreButton());

      function moreButton() {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "wtg9ga_panelRow";
        button.setAttribute("aria-label", "更多");
        button.setAttribute("aria-haspopup", "menu");
        button.textContent = "\u22ef";
        return button;
      }

      const logEl = document.getElementById("log");
      const lines = [];
      function log(message) {
        lines.push(message);
        logEl.textContent = lines.join("\n");
        console.log("[harness]", message);
      }
      window.__harnessLog = log;

      window.addEventListener("error", (event) => log("ERROR " + event.message));
      window.addEventListener("unhandledrejection", (event) =>
        log("REJECTION " + (event.reason && event.reason.message))
      );

      const ctx = {
        slots: {
          entriesOfSlot() {
            return ENTRIES.map(([id, label]) => ({ options: { id, label } }));
          },
        },
        effect(fn) {
          const dispose = fn();
          return () => typeof dispose === "function" && dispose();
        },
      };

      function panelButtons() {
        return Array.from(nav.querySelectorAll("button[aria-label]")).filter(
          (button) => !button.hasAttribute("aria-haspopup")
        );
      }

      function currentOrder() {
        return panelButtons().map(
          (button) => button.dataset.modmenuKey || button.getAttribute("aria-label")
        );
      }

      function visualOrder() {
        return panelButtons()
          .filter((button) => button.style.display !== "none")
          .map((button) => ({ key: button.dataset.modmenuKey, top: button.getBoundingClientRect().top }))
          .sort((a, b) => a.top - b.top)
          .map((item) => item.key);
      }

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function pointer(type, element, x, y, extra) {
        const target = element || document;
        const event = new PointerEvent(type, {
          bubbles: true,
          cancelable: true,
          composed: true,
          clientX: x,
          clientY: y,
          button: 0,
          buttons: type === "pointerup" ? 0 : 1,
          isPrimary: true,
          pointerId: 1,
          pointerType: "mouse",
          ...extra,
        });
        target.dispatchEvent(event);
      }

      async function run() {
        localStorage.removeItem("dsh.modmenu.layout.v1");
        log("module loaded: " + Object.keys(window.__loadedModules).join(","));
        try {
          window.__plugin.apply(ctx);
        } catch (error) {
          log("APPLY THREW: " + error.stack);
          return;
        }
        await wait(300);
        log("applied; rows=" + currentOrder().length);
        log("order0=" + JSON.stringify(currentOrder()));
        log("visual0=" + JSON.stringify(visualOrder()));
        log("api=" + JSON.stringify(window.__dshModmenu.status()));

        const buttons = panelButtons();
        const last = buttons[buttons.length - 1];
        const first = buttons[0];
        const lastRect = last.getBoundingClientRect();
        const firstRect = first.getBoundingClientRect();
        const startX = lastRect.left + 40;
        const startY = lastRect.top + lastRect.height / 2;

        pointer("pointerdown", last, startX, startY);
        await wait(420);
        log("gesture after hold: " + Boolean(window.__dshModmenu.status().dragging));
        pointer("pointermove", document, startX, firstRect.top + 2);
        await wait(60);
        pointer("pointerup", document, startX, firstRect.top + 2);
        await wait(200);

        log("order1=" + JSON.stringify(currentOrder()));
        log("visual1=" + JSON.stringify(visualOrder()));
        log("stored=" + localStorage.getItem("dsh.modmenu.layout.v1"));

        window.__dshModmenu.reset();
        await wait(200);
        log("order2(after reset)=" + JSON.stringify(visualOrder()));

        // --- drag a row onto the "More" anchor: it must be tucked away ------
        const more = nav.querySelector('button[aria-haspopup="menu"]');
        const moreRect = more.getBoundingClientRect();
        const hideTarget = panelButtons()[0];
        const hideKey = hideTarget.dataset.modmenuKey;
        const hideRect = hideTarget.getBoundingClientRect();
        pointer("pointerdown", hideTarget, hideRect.left + 40, hideRect.top + hideRect.height / 2);
        await wait(420);
        log("hide gesture dragging: " + Boolean(window.__dshModmenu.status().dragging));
        pointer("pointermove", document, moreRect.left + moreRect.width / 2, moreRect.top + moreRect.height / 2);
        await wait(60);
        pointer("pointerup", document, moreRect.left + moreRect.width / 2, moreRect.top + moreRect.height / 2);
        await wait(220);
        log("hidden=" + JSON.stringify(window.__dshModmenu.status().hidden));
        log("hiddenKey=" + hideKey + " display=" + JSON.stringify(hideTarget.style.display));
        log("visualAfterHide=" + JSON.stringify(visualOrder()));

        // --- and get it back via the API (the More menu uses the same path) --
        window.__dshModmenu.reveal(hideKey);
        await wait(220);
        log("hiddenAfterReveal=" + JSON.stringify(window.__dshModmenu.status().hidden));
        log("displayAfterReveal=" + JSON.stringify(hideTarget.style.display));
        log("visualAfterReveal=" + JSON.stringify(visualOrder()));

        // --- a drag must survive DOM churn and scrolling ---------------------
        const grabRow = panelButtons()[0];
        const churnRow = panelButtons()[3];
        const grabRect = grabRow.getBoundingClientRect();
        log(
          "resilience target=" +
            grabRow.dataset.modmenuKey +
            " rect=" +
            Math.round(grabRect.left) +
            "," +
            Math.round(grabRect.top) +
            "," +
            Math.round(grabRect.width) +
            "x" +
            Math.round(grabRect.height) +
            " display=" +
            getComputedStyle(grabRow).display
        );
        pointer("pointerdown", grabRow, grabRect.left + 40, grabRect.top + grabRect.height / 2);
        await wait(60);
        log(
          "pressing=" +
            Boolean(document.querySelector(".dshmodmenu-pressing")) +
            " draggingSoon=" +
            window.__dshModmenu.status().dragging
        );
        await wait(360);
        log("resilience dragging: " + Boolean(window.__dshModmenu.status().dragging));
        // simulate React replacing a row, plus unrelated page scrolling
        const churnClone = churnRow.cloneNode(true);
        churnRow.replaceWith(churnClone);
        document.dispatchEvent(new Event("scroll"));
        await wait(140);
        log("draggingAfterMutation: " + Boolean(window.__dshModmenu.status().dragging));
        const dropRect = churnClone.getBoundingClientRect();
        pointer("pointermove", document, grabRect.left + 40, dropRect.top + 2);
        await wait(80);
        pointer("pointerup", document, grabRect.left + 40, dropRect.top + 2);
        await wait(240);
        log("draggingAfterDrop: " + Boolean(window.__dshModmenu.status().dragging));
        log("visualAfterResilience=" + JSON.stringify(visualOrder()));
        log("DONE");
      }

      run();
    </script>
  </body>
</html>
